[project]
name = "daily-dash-model-gateway"
version = "0.1.0"
description = "Provider-isolated model gateway for DailyDash."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pydantic>=2.12,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_dash_model_gateway"]
