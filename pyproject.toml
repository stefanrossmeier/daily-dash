[project]
name = "daily-dash"
version = "0.1.0"
description = "Self-hosted data intelligence pipelines with LLM-assisted ranking and synthesis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14,<7",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tradingview-datafeed==2.1.1",
    "yfinance>=1.7.0",
]

[project.scripts]
daily-dash = "daily_dash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_dash"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["daily_dash"]

[tool.uv]
required-version = ">=0.11.17"

[tool.coverage.run]
branch = true
source = ["daily_dash"]

[tool.coverage.report]
show_missing = true
skip_covered = false
