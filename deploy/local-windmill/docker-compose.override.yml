services:
  windmill_worker_dailydash:
    build:
      context: ${DAILY_DASH_SOURCE:?DAILY_DASH_SOURCE is required}
      dockerfile: deploy/example/windmill-worker.Dockerfile
      args:
        WM_IMAGE: ${WM_IMAGE}

    image: daily-dash-windmill-worker:local

    restart: unless-stopped
    networks: [default, gateway]

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MODE=worker
      - WORKER_TAGS=dailydash
      - DAILY_DASH_HOME=/opt/daily-dash
      - DAILY_DASH_BIN=/opt/daily-dash/.venv/bin/daily-dash
      - DAILY_DASH_DATA_REPO=/data/daily-dash-data
      - DAILY_DASH_CONFIG_DIR=/opt/daily-dash/config
      - DAILY_DASH_GATEWAY_URL=http://daily-dash-llm-gateway:8080
      - DAILY_DASH_GATEWAY_TOKEN_FILE=/run/daily-dash-secrets/gateway_token
      - DAILY_DASH_ASSETS_DIR=/opt/daily-dash/assets

    volumes:
      - ${DAILY_DASH_DATA_SOURCE:?DAILY_DASH_DATA_SOURCE is required}:/data/daily-dash-data
      - ${DAILY_DASH_GATEWAY_TOKEN_SOURCE:?Set the private gateway token path}:/run/daily-dash-secrets/gateway_token:ro

    depends_on:
      db:
        condition: service_healthy


networks:
  gateway:
    external: true
    name: ${DAILY_DASH_GATEWAY_NETWORK:?Set the owned internal gateway network}
