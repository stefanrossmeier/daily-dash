summary: Deliver DailyDash Futures Snapshot
description: Render a previously persisted Futures Snapshot and deliver it to Telegram.
lock: ''
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    artifact_path:
      type: string
      description: Path returned by the run_futures step.
      default: null
      originalType: string
    telegram_chat_id:
      type: string
      description: ''
      default: null
      originalType: string
    telegram_token:
      type: string
      description: ''
      default: null
      originalType: string
  required:
    - artifact_path
    - telegram_token
    - telegram_chat_id
