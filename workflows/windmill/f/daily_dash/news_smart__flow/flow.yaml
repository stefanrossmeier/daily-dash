summary: DailyDash Smart News
description: Generate Smart News themes, persist the immutable run artifact, then deliver the theme brief to Telegram.
value:
  modules:
    - id: run_news_smart
      summary: Run Smart News
      value:
        type: script
        path: f/daily_dash/run_news_smart
        tag_override: dailydash
        input_transforms:
          data_repo:
            type: static
            value: /data/daily-dash-data

    - id: persist_data
      summary: Persist Smart News artifact
      value:
        type: script
        path: f/daily_dash/persist_data_repo
        tag_override: dailydash
        input_transforms:
          deploy_key:
            type: static
            value: "$var:f/daily_dash/data_repo_deploy_key"
          repo_path:
            type: static
            value: /data/daily-dash-data
          data_path:
            type: static
            value: news/smart
          remote_url:
            type: javascript
            expr: 'variable("f/daily_dash/data_repo_remote_url")'
          branch:
            type: javascript
            expr: 'variable("f/daily_dash/data_repo_branch")'
          commit_message:
            type: static
            value: "data(news-smart): persist generated themes"

    - id: deliver_news_smart
      summary: Deliver Smart News to Telegram
      value:
        type: script
        path: f/daily_dash/deliver_news_smart
        tag_override: dailydash
        input_transforms:
          artifact_path:
            type: javascript
            expr: results.run_news_smart.artifact_path
          telegram_token:
            type: javascript
            expr: variable("f/daily_dash/telegram_token")
          telegram_chat_id:
            type: javascript
            expr: variable("f/daily_dash/telegram_chat_id")

schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
