summary: DailyDash X Watchlist
description: Retrieve curated X posts through Grok, rank market relevance, persist the immutable artifact, then deliver it to Telegram.
value:
  modules:
  - id: run_x_watchlist
    summary: Run X Watchlist report
    value:
      type: script
      path: f/daily_dash/run_x_watchlist
      tag_override: dailydash
      input_transforms:
        data_repo:
          type: static
          value: /data/daily-dash-data
  - id: persist_data
    summary: Persist X Watchlist artifact
    value:
      type: script
      path: f/daily_dash/persist_data_repo
      tag_override: dailydash
      input_transforms:
        deploy_key:
          type: static
          value: $var:f/daily_dash/data_repo_deploy_key
        repo_path:
          type: static
          value: /data/daily-dash-data
        data_path:
          type: static
          value: x-watchlist/snapshots
        remote_url:
          type: javascript
          expr: variable("f/daily_dash/data_repo_remote_url")
        branch:
          type: javascript
          expr: variable("f/daily_dash/data_repo_branch")
        commit_message:
          type: static
          value: 'data(x-watchlist): persist X market-signal report'
  - id: deliver_x_watchlist
    summary: Deliver X Watchlist report to Telegram
    value:
      type: script
      path: f/daily_dash/deliver_x_watchlist
      tag_override: dailydash
      input_transforms:
        artifact_path:
          type: javascript
          expr: results.run_x_watchlist.artifact_path
        telegram_token:
          type: javascript
          expr: variable("f/daily_dash/telegram_token")
        telegram_chat_id:
          type: javascript
          expr: variable("f/daily_dash/telegram_chat_id")
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
