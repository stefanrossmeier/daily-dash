summary: DailyDash Markets
description: Retrieve, persist and deliver the DailyDash Markets report.
value:
  modules:
    - id: run_markets
      summary: Run Markets
      value:
        type: script
        path: f/daily_dash/run_markets
        tag_override: dailydash
        input_transforms:
          telegram_token:
            type: static
            value: "$var:f/daily_dash/telegram_token"
          telegram_chat_id:
            type: static
            value: "$var:f/daily_dash/telegram_chat_id"
          data_repo:
            type: static
            value: /data/daily-dash-data
          delivery:
            type: static
            value: telegram

    - id: persist_data
      summary: Persist generated data
      value:
        type: script
        path: f/daily_dash/persist_data_repo
        tag_override: dailydash
        input_transforms:
          deploy_key:
            type: static
            value: "$var:f/daily_dash/data_repo_deploy_key"
          repo_path:
            type: static
            value: /data/daily-dash-data
          data_path:
            type: static
            value: markets/snapshots
          remote_url:
            type: javascript
            expr: 'variable("f/daily_dash/data_repo_remote_url")'
          branch:
            type: javascript
            expr: 'variable("f/daily_dash/data_repo_branch")'
          commit_message:
            type: static
            value: "data(markets): persist generated snapshot"

schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
