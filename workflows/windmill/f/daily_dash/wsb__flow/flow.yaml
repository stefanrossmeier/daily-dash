summary: DailyDash WSB
description: Retrieve and classify market-relevant WallStreetBets threads, persist
  the immutable artifact, then deliver it to Telegram.
value:
  modules:
  - id: run_wsb
    summary: Run WSB report
    value:
      type: script
      path: f/daily_dash/run_wsb
      tag_override: dailydash
      input_transforms:
        data_repo:
          type: static
          value: /data/daily-dash-data
        reddit_client_id:
          type: javascript
          expr: variable("f/daily_dash/reddit_client_id")
        reddit_client_secret:
          type: javascript
          expr: variable("f/daily_dash/reddit_client_secret")
        reddit_user_agent:
          type: javascript
          expr: variable("f/daily_dash/reddit_user_agent")
  - id: persist_data
    summary: Persist WSB artifact
    value:
      type: script
      path: f/daily_dash/persist_data_repo
      tag_override: dailydash
      input_transforms:
        deploy_key:
          type: static
          value: $var:f/daily_dash/data_repo_deploy_key
        repo_path:
          type: static
          value: /data/daily-dash-data
        data_path:
          type: static
          value: wsb/snapshots
        remote_url:
          type: javascript
          expr: variable("f/daily_dash/data_repo_remote_url")
        branch:
          type: javascript
          expr: variable("f/daily_dash/data_repo_branch")
        commit_message:
          type: static
          value: 'data(wsb): persist market-relevance report'
  - id: deliver_wsb
    summary: Deliver WSB report to Telegram
    value:
      type: script
      path: f/daily_dash/deliver_wsb
      tag_override: dailydash
      input_transforms:
        artifact_path:
          type: javascript
          expr: results.run_wsb.artifact_path
        telegram_token:
          type: javascript
          expr: variable("f/daily_dash/telegram_token")
        telegram_chat_id:
          type: javascript
          expr: variable("f/daily_dash/telegram_chat_id")
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
