schema_version: 1
profile_id: news-top
pipeline: news

source_set: news-top

retrieval:
  lookback_hours: 8
  max_items_per_source: 50

keywords:
  include: []
  exclude: []

ranking:
  prefilter_limit: 100
  top_k: 12
  llm_enabled: true
  model_alias: rank-cheap
  prompt:
    id: news-ranking
    version: v8
  min_score: 0.55
  screening:
    enabled: true
    batch_size: 25
    finalist_limit: 30
    model_alias: rank-cheap
    prompt:
      id: news-screening
      version: v1

presentation:
  title: Top News
  language: en
  max_items: 12
