name: Bug report
description: Report a reproducible DailyDash defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove/redact API keys, Telegram values, deploy keys, private report data, and other secrets from logs before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable reproduction, including the affected flow/command.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/uv, Docker/Compose, Windmill version, and relevant commit.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or artifact excerpt
      description: Do not include secrets or private generated data that is not necessary to reproduce the issue.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
        - label: I ran `./scripts/check.sh` or explained why it cannot run.
          required: false
